name: Feature request
description: Suggest a focused improvement to the local-first tracker.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the behavior, including privacy or data-portability implications.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Local-first scope
      options:
        - label: This request does not require accounts, hosted sync, telemetry, or publishing personal watch history.
          required: true
