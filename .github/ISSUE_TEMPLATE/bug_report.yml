name: Bug report
description: Report a reproducible problem using synthetic data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach personal databases, watch histories, exports, logs with private details, or credentials.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 2.0.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - macOS app
        - Windows app
        - Linux app
        - Source install
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use fictional titles and remove personal information.
      placeholder: "1. Open…\n2. Select…\n3. See…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal history, notes, credentials, database files, exports, and private log content.
          required: true
