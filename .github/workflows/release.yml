name: Desktop release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    name: Full release verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
          prune-cache: true
      - run: uv sync --locked --extra dev --extra browser
      - name: Verify release tag matches application version
        shell: bash
        run: |
          version=$(uv run python -c 'import watchtracker; print(watchtracker.__version__)')
          test "$GITHUB_REF_NAME" = "v$version"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --ignore=tests/test_browser_e2e.py
      - run: uv run python scripts/benchmark_local.py
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest tests/test_browser_e2e.py
      - run: uv run pip-audit --skip-editable
      - run: uv build
      - name: Build easy PMT Server Beta setup bundle
        shell: bash
        run: |
          mkdir -p release/pmt-server-setup-beta/scripts release/pmt-server-setup-beta/packaging
          sed '/^    build: \.$/d' compose.yaml > release/pmt-server-setup-beta/compose.yaml
          cp compose.postgres.yaml server.env.example release/pmt-server-setup-beta/
          cp scripts/install-pmt-server.sh scripts/pmt-server-control.sh release/pmt-server-setup-beta/scripts/
          cp "packaging/Install PMT Server Beta.command" release/pmt-server-setup-beta/packaging/
          printf '%s-beta\n' "$GITHUB_REF_NAME" > release/pmt-server-setup-beta/PMT_SERVER_VERSION
          chmod +x release/pmt-server-setup-beta/scripts/*.sh "release/pmt-server-setup-beta/packaging/Install PMT Server Beta.command"
          (cd release && zip -r "PMT-Server-Setup-Beta-${GITHUB_REF_NAME}.zip" pmt-server-setup-beta)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-packages
          path: |
            dist/*
            release/PMT-Server-Setup-Beta-*.zip
          if-no-files-found: error

  desktop:
    name: ${{ matrix.artifact }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: macos-arm64
          - os: windows-latest
            artifact: windows-x64
          - os: ubuntu-latest
            artifact: linux-x64
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
      - name: Confirm Apple Silicon runner
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = arm64
      - run: uv sync --locked --extra dev --extra desktop --extra packaging
      - run: uv run python scripts/build_icons.py
      - run: uv run pyinstaller packaging/watchtracker.spec --noconfirm --clean
      - name: Import and apply macOS signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12 != '' && env.MACOS_SIGN_IDENTITY != ''
        shell: bash
        run: |
          certificate="$RUNNER_TEMP/watchtracker-signing.p12"
          keychain="$RUNNER_TEMP/watchtracker-signing.keychain-db"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p actions "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p actions "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$keychain"
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" "dist/Personal Media Tracker.app"
          codesign --verify --deep --strict --verbose=2 "dist/Personal Media Tracker.app"
      - name: Apply Windows code signature
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_PFX != ''
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'watchtracker-signing.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          $executable = Get-ChildItem 'dist/Personal Media Tracker' -Filter '*.exe' | Select-Object -First 1
          & signtool sign /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $executable.FullName
          & signtool verify /pa /v $executable.FullName
      - name: Smoke-test packaged application
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            executable="dist/Personal Media Tracker.app/Contents/MacOS/Personal Media Tracker"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            executable="dist/Personal Media Tracker/Personal Media Tracker.exe"
          else
            executable="dist/personal-media-tracker/personal-media-tracker"
          fi
          "$executable" --smoke-test --data-dir "$RUNNER_TEMP/watchtracker-packaged-smoke"
          test ! -e "dist/watchtracker.sqlite3"
      - name: Notarize and staple macOS application bundle
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12 != '' && env.MACOS_SIGN_IDENTITY != '' && env.MACOS_NOTARY_APPLE_ID != '' && env.MACOS_NOTARY_PASSWORD != '' && env.MACOS_NOTARY_TEAM_ID != ''
        shell: bash
        run: |
          submission="$RUNNER_TEMP/Personal-Media-Tracker-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/Personal Media Tracker.app" "$submission"
          xcrun notarytool submit "$submission" --apple-id "$MACOS_NOTARY_APPLE_ID" --password "$MACOS_NOTARY_PASSWORD" --team-id "$MACOS_NOTARY_TEAM_ID" --wait
          xcrun stapler staple "dist/Personal Media Tracker.app"
          xcrun stapler validate "dist/Personal Media Tracker.app"
      - name: Create macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "dist/Personal Media Tracker.app" "release/Personal-Media-Tracker-${GITHUB_REF_NAME}-macOS-arm64.zip"
          dmg_source="$RUNNER_TEMP/watchtracker-dmg"
          mkdir -p "$dmg_source"
          ditto "dist/Personal Media Tracker.app" "$dmg_source/Personal Media Tracker.app"
          ln -s /Applications "$dmg_source/Applications"
          hdiutil create -volname "Personal Media Tracker" -srcfolder "$dmg_source" -ov -format UDZO "release/Personal-Media-Tracker-${GITHUB_REF_NAME}-macOS-arm64.dmg"
      - name: Notarize macOS artifacts
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12 != '' && env.MACOS_SIGN_IDENTITY != '' && env.MACOS_NOTARY_APPLE_ID != '' && env.MACOS_NOTARY_PASSWORD != '' && env.MACOS_NOTARY_TEAM_ID != ''
        shell: bash
        run: |
          xcrun notarytool submit "release/Personal-Media-Tracker-${GITHUB_REF_NAME}-macOS-arm64.dmg" --apple-id "$MACOS_NOTARY_APPLE_ID" --password "$MACOS_NOTARY_PASSWORD" --team-id "$MACOS_NOTARY_TEAM_ID" --wait
          xcrun stapler staple "release/Personal-Media-Tracker-${GITHUB_REF_NAME}-macOS-arm64.dmg"
      - name: Create Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path 'dist/Personal Media Tracker/*' -DestinationPath "release/Personal-Media-Tracker-$env:GITHUB_REF_NAME-Windows-x64.zip"
      - name: Create Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp packaging/personal-media-tracker.desktop dist/personal-media-tracker/personal-media-tracker.desktop
          cp packaging/icons/watchtracker-256.png dist/personal-media-tracker/personal-media-tracker.png
          cp packaging/install-linux.sh dist/personal-media-tracker/
          printf '%s\n' "${GITHUB_REF_NAME#v}" > dist/personal-media-tracker/PMT_BUNDLE_VERSION
          chmod +x dist/personal-media-tracker/install-linux.sh
          install_home="$RUNNER_TEMP/pmt-linux-install-home"
          mkdir -p "$install_home"
          HOME="$install_home" XDG_DATA_HOME="$install_home/share" dist/personal-media-tracker/install-linux.sh
          test "$("$install_home/share/personal-media-tracker/personal-media-tracker" --version)" = "${GITHUB_REF_NAME#v}"
          mkdir -p release
          tar -C dist -czf "release/Personal-Media-Tracker-${GITHUB_REF_NAME}-Linux-x64.tar.gz" personal-media-tracker
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  server-container:
    name: Publish PMT Server container
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/asvpatm/personal-media-tracker-server:${{ github.ref_name }}-beta
            ghcr.io/asvpatm/personal-media-tracker-server:beta

  publish:
    name: Publish checked artifacts
    needs: [desktop, server-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download Python and server setup packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-packages
          path: python-release-files
      - name: Download desktop packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release-files
          pattern: desktop-*
          merge-multiple: true
      - name: Collect Python and server setup files
        shell: bash
        run: |
          find python-release-files/dist python-release-files/release \
            -mindepth 1 -maxdepth 1 -type f \
            -exec mv {} release-files/ \;
          test -n "$(find release-files -maxdepth 1 -type f -print -quit)"
      - name: Generate SHA-256 checksums
        working-directory: release-files
        shell: bash
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: release-files/*
