services:
  tracker:
    build: .
    image: personal-media-tracker:local-preview
    init: true
    restart: unless-stopped
    command:
      - personal-media-tracker
      - --no-open
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - run
    environment:
      WATCHTRACKER_ACCESS_MODE: local
      WATCHTRACKER_CONTAINERIZED_LOCAL: "true"
      WATCHTRACKER_HOST: 0.0.0.0
      WATCHTRACKER_PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - pmt-local-data:/var/lib/pmt
    networks:
      pmt-private:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 30s

networks:
  pmt-private:

volumes:
  pmt-local-data:
